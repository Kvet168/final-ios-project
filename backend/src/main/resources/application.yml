server:
  port: ${PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 64KB
  # Hosts like Render terminate HTTPS at a proxy; trust its X-Forwarded-* headers so links and redirects use https.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: wayfarer-api
  datasource:
    # Either a JDBC URL with DATABASE_USER/DATABASE_PASSWORD, or the provider form postgres://user:pass@host/db
    # (converted by ConnectionUrlEnvironmentPostProcessor).
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/wayfarer}
    username: ${DATABASE_USER:wayfarer}
    password: ${DATABASE_PASSWORD:wayfarer_local_only}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Fail fast and visibly when the database is unreachable. A longer pool fail-timeout makes Flyway's startup checks
      # retry it silently forever (the server then hangs with no error); Flyway's own bounded retries cover a database
      # that is still starting.
      connection-timeout: 10000
      initialization-fail-timeout: 1
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s
  flyway:
    enabled: true
    # Database still starting (e.g. right after a host restart): retry for about a minute, then exit with the error.
    connect-retries: 5
    connect-retries-interval: 15
    # Attaching to a database the Express backend already created (same schema as V1): treat V1 as applied.
    baseline-on-migrate: true
    baseline-version: "1"
    # `seed` adds sample data and demo users; remove it (SPRING_FLYWAY_LOCATIONS) for a clean production database.
    locations: ${FLYWAY_LOCATIONS:classpath:db/migration,classpath:db/seed}
    placeholders:
      demoPassword: ${DEMO_PASSWORD:Wayfarer#Demo2026}
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /api/docs
  api-docs:
    path: /api/openapi

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # Redis is optional (cache, rate limit, token denylist all fail open); don't let it mark the service DOWN.
    redis:
      enabled: false

wayfarer:
  prod: ${WAYFARER_PROD:false}
  hold-minutes: ${BOOKING_HOLD_MINUTES:30}
  jwt:
    # Must be at least 32 bytes. The default is for local development only; production must set JWT_ACCESS_SECRET.
    access-secret: ${JWT_ACCESS_SECRET:dev-only-access-secret-change-me-0123456789}
    access-ttl-sec: 900
    refresh-ttl-sec: 2592000
    issuer: wayfarer
  payment:
    mode: ${PAYMENT_PROVIDER_MODE:mock}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev-webhook-secret}
  rate-limit:
    auth-max: ${AUTH_RATE_LIMIT_MAX:30}
    window-sec: 900
  firebase:
    # Firebase project id (Project settings in the Firebase console). Empty disables Firebase sign-in.
    project-id: ${FIREBASE_PROJECT_ID:}
  google:
    # Comma-separated OAuth client IDs (web, iOS, Android) whose Google ID tokens are accepted. Empty disables Google sign-in.
    client-ids: ${GOOGLE_CLIENT_ID:}
  cors-origins: ${CORS_ORIGINS:*}
  cache-ttl-sec: 300
  ai:
    api-key: ${AI_PROVIDER_API_KEY:}
    # anthropic | gemini | auto (auto uses Anthropic for keys starting with sk-ant- and Gemini for any other key). Leave AI_MODEL empty for the provider's default.
    provider: ${AI_PROVIDER:auto}
    model: ${AI_MODEL:}
    requests-per-minute: ${AI_RATE_LIMIT_PER_MINUTE:20}
