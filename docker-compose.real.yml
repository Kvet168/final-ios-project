# Run the API (and the /admin, /partner, /business dashboards) on this computer against the REAL VPS database.
#   docker compose -f docker-compose.real.yml --env-file .env up --build
# Reads .env (git-ignored): REAL_DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD, JWT_ACCESS_SECRET, PAYMENT_WEBHOOK_SECRET, AI_*.
# Redis is local (the VPS Redis is internal-only). Stop the normal local stack first (docker compose down): both use :8080.
# WARNING: this writes to production data and Flyway will apply any new migration to it.
name: wayfarer-real
services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    depends_on:
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: ${REAL_DATABASE_URL:?set REAL_DATABASE_URL in .env}
      DATABASE_USER: ${DATABASE_USER:?}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?}
      WAYFARER_PROD: "true"
      PAYMENT_PROVIDER_MODE: ${PAYMENT_PROVIDER_MODE:-mock}
      SERVER_MAX_HTTP_REQUEST_HEADER_SIZE: 64KB
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-travel-app-5b220}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_MODEL: ${AI_MODEL:-}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
    ports: ["8080:8080"]
