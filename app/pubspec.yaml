name: wayfarer
description: "WAYFARER: AI travel, hotel and trip-planning app (Android)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  intl: ^0.20.3
  url_launcher: ^6.3.3
  geolocator: ^14.1.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Every photo and both typefaces (Space Grotesk, with Kantumruy Pro for Khmer) ship inside the app, so the UI never waits on (or breaks without) a web host.
  assets:
    - assets/img/
    - assets/img/t/

  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk.ttf
    - family: KantumruyPro
      fonts:
        - asset: assets/fonts/KantumruyPro.ttf
        - asset: assets/fonts/KantumruyPro-Italic.ttf
          style: italic
