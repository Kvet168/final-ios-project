name: wayfarer
description: "WAYFARER: AI travel, hotel and trip-planning app (Android)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  intl: ^0.20.3
  url_launcher: ^6.3.3
  geolocator: ^14.1.1
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  pdf: ^3.13.1
  printing: ^5.15.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  # Every photo and both typefaces (Spinnaker, with MiSans Khmer for Khmer) ship inside the app, so the UI never waits on (or breaks without) a web host.
  assets:
    - assets/img/
    - assets/img/t/
    - assets/icons3d/

  fonts:
    - family: Spinnaker
      fonts:
        - asset: assets/fonts/Spinnaker-Regular.ttf
    # Khmer: MiSans Khmer by Xiaomi (see assets/fonts/NOTICE-MiSans.txt), two weights only. Bolder requests use Semibold.
    - family: MiSansKhmer
      fonts:
        - asset: assets/fonts/MiSansKhmer-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSansKhmer-Semibold.ttf
          weight: 600
